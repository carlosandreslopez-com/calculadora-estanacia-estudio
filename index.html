    <style>
      /* For custom scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; /* slate-800 */
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; /* slate-600 */

<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

  }
}
</script>
</head>
  <body class="bg-slate-900">
    <div id="root"></div>
    <script>
      // Dynamically load the main script with a cache-busting timestamp.
      // This ensures the browser always fetches the latest version of the app,
      // preventing issues with stale, cached, and potentially broken code.
      const script = document.createElement('script');
      script.type = 'module';
      // Use a relative path './' to ensure it works correctly on nested paths like GitHub Pages.
      script.src = `./index.tsx?v=${Date.now()}`;
      document.body.appendChild(script);
    </script>
  </body>
