<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay Duration Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* For custom scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; /* slate-800 */
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; /* slate-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; /* slate-500 */
      }
    </style>
    <!--
      The importmap has been removed because esm.sh handles all module resolution,
      including React. This prevents version conflicts and simplifies the setup for production.
    -->
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-slate-900">
    <div id="root"></div>
    <!--
      CACHE BUSTING SCRIPT:
      This script dynamically creates the module script tag. By appending the current
      timestamp (`?t=<timestamp>`) to the URL, we trick the browser and esm.sh into
      thinking it's a new file on every page load. This forces them to bypass their
      caches and fetch the absolute latest version of the code from GitHub.
      This solves the issue of seeing an outdated version of the application.
    -->
    <script type="module">
      const script = document.createElement('script');
      script.type = 'module';
      const timestamp = new Date().getTime();
      script.src = `https://esm.sh/gh/carlosandreslopez-com/calculadora-estanacia-estudio/index.tsx?t=${timestamp}`;
      document.body.appendChild(script);
    </script>
  </body>
</html>
