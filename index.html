<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay Duration Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* For custom scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; /* slate-800 */
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; /* slate-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; /* slate-500 */
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-900">
    <script>
      // Set a global variable with the page load timestamp.
      // The React app will display this in the footer for version verification.
      window.APP_VERSION = new Date().toLocaleString('es-ES', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      });
    </script>
    <div id="root"></div>
    <script type="module">
      const script = document.createElement('script');
      script.type = 'module';
      // Use `?bundle` to combine all JS into one file and a timestamp to bust the cache.
      // This ensures the latest version of the entire app is always loaded.
      script.src = `https://esm.sh/gh/carlosandreslopez-com/calculadora-estanacia-estudio@main/index.tsx?bundle&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
