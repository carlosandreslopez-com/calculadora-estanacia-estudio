<!DOCTYPE html>
<html lang="es">
  <head>

    <title>Calculadora de Estancia de Estudiante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1. Se añade Babel Standalone para la transpilación de TSX/JSX en el navegador -->

    <style>
      /* For custom scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;

        background: #1e293b; /* slate-800 */

      ::-webkit-scrollbar-thumb {

<script type="importmap">
{

  <body class="bg-slate-900">
